name: Prepare research author
on:
  push:
    branches: ['agent/research-author-20261028']
    paths: ['.github/workflows/author-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/research.rs')
          s = p.read_text()
          assert 'pub mod author;' not in s
          p.write_text(s + '\n/// Bounded source editing for model-driven research.\npub mod author;\n')
          PY
          cargo fmt --all
          cargo test --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Commit prepared files and remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          repo, branch, sha = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_REF_NAME'], os.environ['GITHUB_SHA']
          assert repo == 'beamiter/jagent' and branch == 'agent/research-author-20261028'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines())
          assert changed <= {'src/research.rs', 'src/research/author.rs', 'tests/research_author.rs'}, changed
          def api(path, body=None, method=None):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + path, data=None if body is None else json.dumps(body).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json'}, method=method or ('GET' if body is None else 'POST'))
              with urllib.request.urlopen(req) as response: return json.load(response)
          assert api('/git/ref/heads/' + branch)['object']['sha'] == sha
          entries = [{'path': p, 'mode': '100644', 'type': 'blob', 'content': pathlib.Path(p).read_text()} for p in sorted(changed)]
          entries.append({'path': '.github/workflows/author-prepare.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('/git/trees', {'base_tree': api('/git/commits/' + sha)['tree']['sha'], 'tree': entries})['sha']
          commit = api('/git/commits', {'tree': tree, 'parents': [sha], 'message': 'feat(research): expose and format validated source-authoring protocol'})['sha']
          api('/git/refs/heads/' + branch, {'sha': commit, 'force': False}, 'PATCH')
          print('PREPARED_COMMIT=' + commit)
          PY
