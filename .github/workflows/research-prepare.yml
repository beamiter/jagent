name: Prepare research formatting
on:
  push:
    branches: ['agent/autoresearch-bridge-20261028']
    paths: ['.github/workflows/research-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all
      - name: Save only formatting and remove this one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['GITHUB_REF_NAME']
          sha = os.environ['GITHUB_SHA']
          assert repo == 'beamiter/jagent' and branch == 'agent/autoresearch-bridge-20261028'
          allowed = {'src/research.rs', 'tests/research.rs'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines())
          assert changed <= allowed, changed
          def api(path, body=None, method=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
                  method=method or ('GET' if body is None else 'POST'))
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          assert api('/git/ref/heads/' + branch)['object']['sha'] == sha
          base = api('/git/commits/' + sha)['tree']['sha']
          entries = [{'path': path, 'mode': '100644', 'type': 'blob',
                      'content': pathlib.Path(path).read_text()} for path in sorted(changed)]
          entries.append({'path': '.github/workflows/research-prepare.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('/git/trees', {'base_tree': base, 'tree': entries})['sha']
          commit = api('/git/commits', {'message': 'style(research): apply rustfmt; remove preparation workflow',
                      'tree': tree, 'parents': [sha]})['sha']
          api('/git/refs/heads/' + branch, {'sha': commit, 'force': False}, 'PATCH')
          print('PREPARED_COMMIT=' + commit)
          PY
