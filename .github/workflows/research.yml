name: Research protocol
on:
  push:
    paths: ['src/**', 'tests/**', 'Cargo.*', '.github/workflows/research.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'Cargo.*', '.github/workflows/research.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['stable', '1.86.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      # Explicit +toolchain is required: rust-toolchain.toml otherwise selects stable.
      - run: cargo +${{ matrix.toolchain }} test --locked --all-targets --all-features --no-fail-fast
      - run: cargo +${{ matrix.toolchain }} test --locked --all-features --doc
      # Lint/style policy follows stable. MSRV still compiles and runs every test.
      # Old Clippy reports needless_lifetimes in the existing session.rs visitor.
      - if: matrix.toolchain == 'stable'
        run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +${{ matrix.toolchain }} doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - if: matrix.toolchain == 'stable'
        run: cargo +stable fmt --all -- --check
