[package]
name = "jagent"
version = "0.7.0"
edition = "2021"
rust-version = "1.86"
description = "Review-first terminal AI agent core: bounded sessions, provider protocols, streaming, and safety (sans-IO)"
readme = "README.md"
repository = "https://github.com/beamiter/jagent"
homepage = "https://github.com/beamiter/jagent"
documentation = "https://docs.rs/jagent"
keywords = ["terminal", "shell", "agent", "ai", "llm"]
categories = ["command-line-utilities"]
license = "MIT OR Apache-2.0"
include = [
    "/src/**",
    "/examples/**",
    "/docs/**",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/SECURITY.md",
]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Downstream feature unification must not change the duplicate-member or
# top-level-object contracts. Keep serde_json's map-backed number and raw-value
# paths in CI.
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
